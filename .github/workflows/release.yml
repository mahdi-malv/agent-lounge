name: Release

# Push a tag such as v0.2.0 to build the macOS DMG and the Android APK and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build DMG
        run: make dmg VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/Agent-Lounge-*.dmg
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. The APK is signed with a debug key."
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew --console=plain testDebugUnitTest assembleRelease \
            -PversionName="$version" -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Agent-Lounge-Companion-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/Agent-Lounge-Companion-*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Download
            - **macOS** (macOS 26+, Apple silicon): `Agent-Lounge-*.dmg`. Open it and drag **Agent Lounge** to Applications.
              The app is not notarized. On first launch run `xattr -dr com.apple.quarantine "/Applications/Agent Lounge.app"`,
              or right-click the app → **Open**.
            - **Android** (7.0+): `Agent-Lounge-Companion-*.apk`. Install it and pair it from the Mac app (Settings → Phone).
